version: "3"

tasks:
  default:
      - task --list --taskfile apps/opencode.yaml

  configure:
    desc: "[OPENCODE] ⚙️  Configure OpenCode"
    vars:
      SOURCE_PATH: '{{ "dotfiles/agents" | osClean }}'
      DEST_PATH: '{{ default "$HOME" (default (env "USERPROFILE") (env "HOME")) }}{{ "/.config/opencode" | osClean }}'
    dir: "{{ .SOURCE_PATH }}"
    sources:
      - tui.json
    method: none
    cmds:
      - |
        if [ ! -d "{{ .DEST_PATH }}" ]; then
          mkdir -p "{{ .DEST_PATH }}"
        fi
      - for: sources
        cmd: |-
          {{- $dest_path:=osDir .ITEM }}
          cp "{{ .ITEM }}" "{{joinPath .DEST_PATH .ITEM }}"
      - task: config:build
      - task: agents:instructions
      - task: agents:skills
      - >-
        {{ .gum_ok }} "✅ OpenCode configured."

  install:linux:
    internal: true
    platforms: [linux]
    cmds:
      - |
        echo "Installing OpenCode..."
        curl -fsSL https://opencode.ai/install | bash

  update:linux:
    internal: true
    platforms: [linux]
    preconditions:
      - sh: command -v opencode >/dev/null 2>&1
        msg: command 'opencode' not found
    cmds:
      - |
        echo "Updating OpenCode..."
        opencode upgrade

  install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: ::scoop:extras-install
        vars:
            APP: "opencode"

  update:windows:
    internal: true
    platforms: [windows]
    preconditions:
      - sh: command -v opencode >/dev/null 2>&1
        msg: command 'opencode' not found
    cmds:
      - task: ::scoop:update
        vars:
          APP: "opencode"

  install:
    desc: "[OPENCODE] ✨ Install OpenCode cli"
    silent: true
    cmds:
      - task: install:windows
        platforms: [windows]
      - task: install:linux
        platforms: [linux]
      - task: configure

  update:
    aliases: [upgrade]
    desc: "[OPENCODE] Update OpenCode"
    silent: true
    cmds:
      - task: update:windows
        platforms: [windows]
      - task: update:linux
        platforms: [linux]
      - task: configure

  agents:instructions:
    desc: "[OPENCODE] Configure OpenCode AGENTS.md instructions"
    vars:
      SOURCE_PATH: '{{ "dotfiles/agents" | osClean }}'
      DEST_PATH: '{{ default "$HOME" (default (env "USERPROFILE") (env "HOME")) }}{{ "/.config/opencode" | osClean }}'
    dir: "{{ .SOURCE_PATH }}"
    sources:
      - "AGENTS.md"
    method: none
    preconditions:
      - sh: test -f 'AGENTS.md'
        msg: 'source file not found: {{ .SOURCE_PATH }}/AGENTS.md'
    cmds:
      - |-
        if [ ! -d "{{ .DEST_PATH }}" ]; then
          mkdir -p "{{ .DEST_PATH }}"
        fi
      - for: sources
        cmd: |-
          {{- $dest_path:=osDir .ITEM }}
          cp "{{ .ITEM }}" "{{joinPath .DEST_PATH .ITEM }}"

  agents:skills:
    desc: "[OPENCODE] Configure OpenCode agents skills"
    vars:
      SOURCE_PATH: '{{ "dotfiles/agents/skills" | osClean }}'
      DEST_PATH: '{{ default "$HOME" (default (env "USERPROFILE") (env "HOME")) }}{{ "/.config/opencode/skills" | osClean }}'
    dir: "{{ .SOURCE_PATH }}"
    sources:
      - "**/*.md"
    method: none
    cmds:
      - |-
        if [ ! -d "{{ .DEST_PATH }}" ]; then
          mkdir -p "{{ .DEST_PATH }}"
        fi
      - for: sources
        cmd: |-
          {{- $dest_path:=osDir .ITEM }}
          {{- if ne $dest_path "skills" -}}
          mkdir -p "{{ joinPath .DEST_PATH $dest_path }}"
          {{- end }}
          cp "{{ .ITEM }}" "{{joinPath .DEST_PATH .ITEM }}"

  config:build:
    desc: "[OPENCODE] Build OpenCode settings"
    vars:
      BASE: opencode_base.json
      OVERRIDES:
        - opencode_override_preferences.json
        - opencode_override_agents.json
        - opencode_override_providers.json
        - opencode_override_mcp_servers.json
      TO: opencode.json
      USER_HOME: '{{ default (env "USERPROFILE") (env "HOME") }}'
      CONFIG_PATH: '{{ expandenv (default (joinPath .USER_HOME "/.config/opencode") .CONFIG_PATH) | replace "\\" "/" }}'
      SETTINGS_BACKUP:
        sh: echo opencode-`date '+%Y-%m-%d-%H-%M'`-$$.json
    preconditions:
      - sh: test -d '{{ .CONFIG_PATH }}'
        msg: 'path does not exist: {{ .CONFIG_PATH }}'
      - sh: test ! -f '{{ .CONFIG_PATH }}/{{ .CONFIG_PATH }}'
        msg: 'would overwrite existing backup: {{ .CONFIG_PATH }}/{{ .SETTINGS_BACKUP }}'
    cmds:
      - |
        if test -f '{{ .CONFIG_PATH }}/{{ .TO }}'; then
          cp {{ .CONFIG_PATH }}/{{ .TO }} {{ .CONFIG_PATH }}/{{ .SETTINGS_BACKUP }}
        fi
        {{- range .OVERRIDES }}
        if ! test -f "{{ $.CONFIG_PATH }}/{{ . }}"; then
          echo "WARN: '{{ . }}' does not exist, creating empty override..."
          echo '{}' > "{{ $.CONFIG_PATH }}/{{ . }}"
        fi
        {{- end }}
        jq -s 'reduce .[] as $obj ({}; . * $obj)' dotfiles/opencode/{{ .BASE }} {{ range .OVERRIDES }}{{ $.CONFIG_PATH }}/{{ . }} {{ end }}> {{ $.CONFIG_PATH }}/{{ .TO }}
