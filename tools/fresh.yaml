version: '3'

tasks:
  default:
    - task --list --taskfile tools/fresh.yaml

  install:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - task: ::winget:install
        vars:
          APP: fresh-editor

  install:linux:
    platforms: [linux]
    internal: true
    silent: true
    cmds:
      - curl https://raw.githubusercontent.com/sinelaw/fresh/refs/heads/master/scripts/install.sh | sh

  install:darwin:
    platforms: [darwin]
    internal: true
    silent: true
    cmds:
      - brew install fresh-editor

  install:
    desc: "[FRESH] ✨ Install fresh terminal IDE"
    silent: true
    cmds:
      - task: install:windows
        platforms: [windows]
      - task: install:linux
        platforms: [linux]
      - task: install:darwin
        platforms: [darwin]
