version: '3'

includes:
  kubecm:
    taskfile: ../lib/github-v2.yaml
    internal: true
    vars:
      HELP_PREFIX: "[KUBECM] ✨  "
      REPO: sunny0826/kubecm
      DOWNLOAD_LINUX: 'kubecm_v%s_Linux_x86_64.tar.gz'
      DOWNLOAD_DARWIN: 'kubecm_v%s_Darwin_x86_64.tar.gz'
      DOWNLOAD_WINDOWS: 'kubecm_v%s_Windows_x86_64.tar.gz'
      TAR_HAS_SUBFOLDER: false
      BINARY_LINUX: '**/kubecm'
      BINARY_DARWIN: '**/kubecm'
      BINARY_WINDOWS: '**/kubecm.exe'
      BINARY_PATH: '$HOME/bin'

  kubectx:
    taskfile: ../lib/github-v2.yaml
    internal: true
    vars:
      HELP_PREFIX: "[KUBECTX] ✨  "
      REPO: ahmetb/kubectx
      DOWNLOAD_LINUX: 'kubectx_v%s_linux_x86_64.tar.gz'
      DOWNLOAD_DARWIN: 'kubectx_v%s_darwin_x86_64.tar.gz'
      DOWNLOAD_WINDOWS: 'kubectx_v%s_windows_x86_64.zip'
      TAR_HAS_SUBFOLDER: false
      BINARY_LINUX: '**/kubectx'
      BINARY_DARWIN: '**/kubectx'
      BINARY_WINDOWS: '**/kubectx.exe'
      BINARY_PATH: '$HOME/bin'

  kubens:
    taskfile: ../lib/github-v2.yaml
    internal: true
    vars:
      HELP_PREFIX: "[KUBENS] ✨  "
      REPO: ahmetb/kubectx
      DOWNLOAD_LINUX: 'kubens_v%s_linux_x86_64.tar.gz'
      DOWNLOAD_DARWIN: 'kubens_v%s_darwin_x86_64.tar.gz'
      DOWNLOAD_WINDOWS: 'kubens_v%s_windows_x86_64.zip'
      TAR_HAS_SUBFOLDER: false
      BINARY_LINUX: '**/kubens'
      BINARY_DARWIN: '**/kubens'
      BINARY_WINDOWS: '**/kubens.exe'
      BINARY_PATH: '$HOME/bin'

  helm:
    taskfile: ../lib/github-v2.yaml
    internal: true
    vars:
      HELP_PREFIX: "[HELM] ✨  "
      REPO: helm/helm
      DOWNLOAD_BASEURL: https://get.helm.sh
      DOWNLOAD_LINUX: 'helm-v%s-linux-amd64.tar.gz'
      DOWNLOAD_DARWIN: 'helm-v%s-darwin-amd64.tar.gz'
      DOWNLOAD_WINDOWS: 'helm-v%s-windows-amd64.zip'
      TAR_HAS_SUBFOLDER: true
      BINARY_LINUX: '**/helm'
      BINARY_DARWIN: '**/helm'
      BINARY_WINDOWS: '**/helm.exe'
      BINARY_PATH: '$HOME/bin'

tasks:
  default:
    - task --list --taskfile tools/k8s.yaml

  install:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - task: ::scoop:buckets:add
        vars:
          BUCKET: lemon
          BUCKET_URL: https://github.com/hoilc/scoop-lemon
      - task: ::scoop:install
        vars:
          APP: kubecm
      - task: ::scoop:install
        vars:
          APP: kubectx
      - task: ::scoop:install
        vars:
          APP: kubens
      - task: ::scoop:install
        vars:
          APP: kubectl
      - task: ::scoop:install
        vars:
          APP: helm

  update:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - task: ::scoop:buckets:ensure
        vars:
          BUCKET: lemon
          BUCKET_URL: https://github.com/hoilc/scoop-lemon
      - task: ::scoop:update
        vars:
          APP: kubecm
      - task: ::scoop:update
        vars:
          APP: kubectx
      - task: ::scoop:update
        vars:
          APP: kubens
      - task: ::scoop:update
        vars:
          APP: kubectl
      - task: ::scoop:update
        vars:
          APP: helm

  install:linux:
    platforms: [linux]
    internal: true
    silent: true
    cmds:
      - task: kubecm:install
      - task: kubectx:install
      - task: kubens:install
      - task: kubectl:install
      - task: helm:install

  update:linux:
    platforms: [linux]
    internal: true
    silent: true
    cmds:
      - task: kubecm:update
      - task: kubectx:update
      - task: kubens:update
      - task: kubectl:install
        vars:
          FORCE: true
      - task: helm:update

  install:
    desc: "[K8S] ✨ Install Kubernetes tools (kubecm, kubectx, kubens, kubectl and helm)"
    cmds:
      - task: install:windows
        platforms: [windows]
      - task: install:linux
        platforms: [linux]

  update:
    desc: "[K8S] ✨ Update Kubernetes tools (kubecm, kubectx, kubens, kubectl and helm)"
    cmds:
      - task: update:windows
        platforms: [windows]
      - task: update:linux
        platforms: [linux]

  ############################################################

  kubectl:install:
    internal: true
    platforms: [linux]
    vars:
      EXECUTABLE: kubectl
      BINARY_PATH: '$HOME/bin'
    status:
      - command -v {{ .EXECUTABLE }} >/dev/null 2>&1 && [ "{{ empty .FORCE }}" == "true" ]
    cmds:
      - |
        {{ .gum_spin }}curl -sL "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o {{ .BINARY_PATH }}/{{ .EXECUTABLE }}
        chmod +x {{ .BINARY_PATH }}/{{ .EXECUTABLE }}
        {{ .gum_ok }} " ✅  {{ .EXECUTABLE }} has been installed successfully."
