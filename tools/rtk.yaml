version: '3'

includes:
  github:
    taskfile: ../lib/github-v2.yaml
    flatten: true
    vars:
      HELP_PREFIX: "[RTK] ✨  "
      REPO: rtk-ai/rtk
      DOWNLOAD_LINUX: 'rtk-x86_64-unknown-linux-musl.tar.gz'
      DOWNLOAD_DARWIN: 'rtk-x86_64-apple-darwin.tar.gz'
      DOWNLOAD_WINDOWS: 'rtk-x86_64-pc-windows-msvc.zip'
      BINARY_LINUX: 'rtk'
      BINARY_DARWIN: 'rtk'
      BINARY_WINDOWS: 'rtk.exe'
      BINARY_PATH: '$HOME/bin'

tasks:
  default:
    - task --list --taskfile tools/rtk.yaml
