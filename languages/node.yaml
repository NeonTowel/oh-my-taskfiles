version: '3'

tasks:
  default:
    - task --list --taskfile languages/node.yaml

  install:node:
    internal: true
    ignore_error: true
    deps: [ '::tools:fnm:install' ]
    preconditions:
      - sh: command -v fnm >/dev/null 2>&1
        msg: command 'fnm' not found, we need it to install NodeJS
    status:
      - node --version
    cmds:
      - |
        eval "$(fnm env --use-on-cd --version-file-strategy=recursive --shell bash)"
        {{ .gum_spin }} fnm install --lts --log-level quiet --progress never --use
        {{- if .CLI_VERBOSE }}
        {{ .gum_info }} "Node version is: $(node --version)"
        {{- end }}

  install:
    desc: "[NODE] ✨ Install node"
    status:
      - node --version
    cmds:
      - task: install:node
